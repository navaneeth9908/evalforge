name: EvalForge release reports

on:
  workflow_call:
    inputs:
      suite-path:
        description: Versioned EvalForge suite JSON
        required: false
        type: string
        default: examples/suite.json
      outputs-path:
        description: Candidate outputs JSON
        required: false
        type: string
        default: examples/outputs.json
      leakage-policy-path:
        description: Sensitive-data policy JSON
        required: false
        type: string
        default: examples/leakage-policy.json

permissions: {}

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.24"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Evaluate release gates
        id: evaluation
        continue-on-error: true
        env:
          SUITE_PATH: ${{ inputs.suite-path }}
          OUTPUTS_PATH: ${{ inputs.outputs-path }}
        run: |
          uv run --frozen evalforge evaluate "$SUITE_PATH" "$OUTPUTS_PATH" \
            --report-path reports/evaluation.json \
            --junit-path reports/evaluation.junit.xml

      - name: Scan safety findings
        id: safety
        continue-on-error: true
        env:
          OUTPUTS_PATH: ${{ inputs.outputs-path }}
          LEAKAGE_POLICY_PATH: ${{ inputs.leakage-policy-path }}
        run: |
          uv run --frozen evalforge scan-leakage "$OUTPUTS_PATH" \
            --policy "$LEAKAGE_POLICY_PATH" \
            --report-path reports/leakage.json \
            --sarif-path reports/safety.sarif.json

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evalforge-ci-reports
          path: |
            reports/evaluation.json
            reports/evaluation.junit.xml
            reports/leakage.json
            reports/safety.sarif.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish safety findings
        if: always() && hashFiles('reports/safety.sarif.json') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: reports/safety.sarif.json
          category: evalforge-safety

      - name: Enforce EvalForge gates
        if: always() && (steps.evaluation.outcome != 'success' || steps.safety.outcome != 'success')
        run: exit 1
